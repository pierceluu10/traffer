apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubera
  labels:
    app: kubera
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubera
  template:
    metadata:
      labels:
        app: kubera
    spec:
      containers:
        - name: kubera
          image: kubera:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
